const TEX={
 earth:['https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/earthmap1k.jpg','https://raw.githubusercontent.com/jeromeetienne/threex.planets/master/images/earthmap1k.jpg'],

const texCache={};
const loader=new THREE.TextureLoader(); loader.setCrossOrigin('anonymous');
function toast(msg,ok=false){const el=$('toast');el.textContent=msg;el.style.opacity=1;el.style.background=ok?'rgba(6,182,212,.92)':'rgba(239,68,68,.92)';clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity=0,3500);}
let texState={planet:null,status:'idle'};   // status: loading | ok | fail — kept so the warning stays visible and survives a language change
function showTexStatus(){
  const el=$('tex-status'), pn=L(PLANET_NAME[texState.planet]||PLANET_NAME.earth);
  if(texState.status==='loading'){el.textContent=T[lang].texLoading(pn);el.classList.remove('hidden');}
  else if(texState.status==='fail'){el.textContent=T[lang].texFail(pn);el.classList.remove('hidden');}
  else el.classList.add('hidden');
}
let texToken=0;
function loadPlanet(p){
  const my=++texToken;            // ignore late responses from a planet we already left
  if(texCache[p]){applyTex(texCache[p]);texState={planet:p,status:'ok'};showTexStatus();return;}
  globe.material.map=null;globe.material.color.set(PLANETS[p].color);globe.material.needsUpdate=true;
  texState={planet:p,status:'loading'};showTexStatus();
  const urls=TEX[p]; let i=0;
  const tryLoad=()=>{
    if(my!==texToken) return;
    if(i>=urls.length){ texState={planet:p,status:'fail'};showTexStatus(); return; }
    loader.load(urls[i],tex=>{tex.colorSpace=THREE.SRGBColorSpace;texCache[p]=tex;if(my!==texToken)return;applyTex(tex);texState={planet:p,status:'ok'};showTexStatus();},
      undefined,()=>{i++;tryLoad();});
  }; tryLoad();
}
function applyTex(tex){globe.material.map=tex;globe.material.color.set(0xffffff);globe.material.needsUpdate=true;}

function latLonToVec(lat,lon,r=1.01){const phi=(90-lat)*Math.PI/180,theta=(lon+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));}

const panel=$('panel');
function updateView(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h;   // false: keep CSS 100% size, never force the page wider than the screen
  let ox=0, oy=0;
  if(!isPhone() && !panel.classList.contains('side-hidden')) ox=(panel.offsetWidth+30)/2;
  if(isPhone()){ const sheet=panel.offsetHeight||0; oy=((150+sheet)-110)/2; }
  if(ox||oy) camera.setViewOffset(w,h,ox,oy,w,h); else camera.clearViewOffset();

}

    markerDiv.appendChild(b); s._m=b;
  });

const _v=new THREE.Vector3(), _c=new THREE.Vector3();
function updateMarkers(){
  const w=innerWidth,h=innerHeight;
  _c.copy(camera.position).normalize();
  SITES.forEach(s=>{
    if(!s._m||s.planet!==currentPlanet)return;
    _v.copy(latLonToVec(s.lat,s.lon)).applyMatrix4(globe.matrixWorld);
    const vis=_v.clone().normalize().dot(_c)>0.25;
    _v.project(camera);
    s._m.style.display=vis?'block':'none';
    s._m.style.transform=`translate(${(_v.x*0.5+0.5)*w}px,${(-_v.y*0.5+0.5)*h}px)`;
  });
}

/* ---------- formatting ---------- */
function fmtCoords(lat,lon){
  const lo=((lon+540)%360)-180;
  return `${nf(Math.abs(lat),2)}° ${lat>=0?'N':'S'}, ${nf(Math.abs(lo),2)}° ${lo>=0?'E':'W'}`;
}
function fmtFact(f){
  if(f.t) return L(f.t);
  return `${f.a?'≈ ':''}${nf(f.v)} ${L(UNITS[f.u])}`;
}
function factCell(label,value,note,span){
  return `<div class="rounded-lg bg-white/5 p-2${span?' col-span-2':''}"><div class="text-[10px] text-gray-400">${label}</div><div class="font-bold">${value}</div>${note?`<div class="text-[10px] text-gray-400">${note}</div>`:''}</div>`;
}

function renderScale(){
  const t=T[lang], s=current;
  const mates=pairMembers(s).filter(x=>x.id!==s.id);
  let html='';
  mates.forEach(m=>{
    COMPARABLE.forEach(k=>{
      const a=s.facts.find(f=>f.k===k&&f.v!=null), b=m.facts.find(f=>f.k===k&&f.v!=null);
      if(!a||!b||a.u!==b.u) return;
      const big=Math.max(a.v,b.v), r=a.v/b.v;
      const lab=L(FACT_LABEL[k]).toLowerCase();
      const R=Math.max(r,1/r), bigN=r>=1?L(s.name):L(m.name), smallN=r>=1?L(m.name):L(s.name);
      let sentence = (R<1.2) ? `${L(s.name)} ≈ ${L(m.name)} (${lab}: ${t.same})` : t.scaleSentence(bigN,smallN,nf(R,R<10?1:0),lab);
      sentence = sentence.charAt(0).toUpperCase()+sentence.slice(1);
      html+=`<div><div class="mb-1">${sentence}</div>
        <div class="flex items-center gap-2"><span class="w-20 truncate text-gray-300">${L(s.name)}</span><div class="flex-1"><div class="bar" style="width:${a.v/big*100}%;background:${s.color}"></div></div><span class="w-16 text-right font-mono">${nf(a.v)} ${L(UNITS[a.u])}</span></div>

function selectSite(id,fly){
  current=SITES.find(s=>s.id===id)||SITES[0];
  if(current.planet!==currentPlanet) switchPlanet(current.planet,true);
  else markerDiv.querySelectorAll('.marker').forEach(m=>m.classList.toggle('active',m.getAttribute('aria-label')===L(current.name)));
  renderPanel(); updateCards();
  current._card?.scrollIntoView({behavior:reduceMotion?'auto':'smooth',inline:'center',block:'nearest'});
  pauseRotateUntil=performance.now()+20000;
  if(fly) flyTo(current.lat,current.lon);
}

/* ---------- camera fly: arcs around the globe (no flying through it), aims at the ROTATED globe ---------- */
let flyAnim=null;
function cancelFly(){ if(flyAnim){cancelAnimationFrame(flyAnim);flyAnim=null;} }
function flyTo(lat,lon){
  cancelFly();
  const camLat=Math.max(-70,Math.min(70,lat));                 // look at polar sites obliquely
  const endDir=latLonToVec(camLat,lon,1).applyQuaternion(globe.quaternion).normalize();
  const startDir=camera.position.clone().normalize();
  const d0=camera.position.length(), d1=isPhone()?4.4:3.0;
  const q=new THREE.Quaternion().setFromUnitVectors(startDir,endDir), qi=new THREE.Quaternion();
  if(reduceMotion){camera.position.copy(endDir.multiplyScalar(d1));return;}
  const t0=performance.now();
  const step=t=>{
    const k=Math.min(1,(t-t0)/1200), e=1-Math.pow(1-k,3);
    qi.identity().slerp(q,e);
    camera.position.copy(startDir).applyQuaternion(qi).multiplyScalar(d0+(d1-d0)*e);
    flyAnim = k<1 ? requestAnimationFrame(step) : null;
  };
  flyAnim=requestAnimationFrame(step);
}
controls.addEventListener('start',()=>{cancelFly();pauseRotateUntil=performance.now()+20000;});

function switchPlanet(p,silent){
  cancelFly();                                   // never keep flying toward a site of the previous planet
  currentPlanet=p;
  document.querySelectorAll('.planet-btn').forEach(b=>{
    const on=b.dataset.planet===p;
    b.setAttribute('aria-pressed',on?'true':'false');
    b.classList.remove('bg-blue-500','bg-gray-200','text-black','bg-red-500','text-gray-300');
    if(on) b.classList.add(...(p==='earth'?['bg-blue-500']:p==='moon'?['bg-gray-200','text-black']:['bg-red-500']));
    else b.classList.add('text-gray-300');
  });
  atmo.visible = p==='earth';
  loadPlanet(p); renderMarkers();
  if(!silent){const first=SITES.find(s=>s.planet===p); if(first) selectSite(first.id,false);}
}
document.querySelectorAll('.planet-btn').forEach(b=>b.onclick=()=>{stopTour();switchPlanet(b.dataset.planet);});
$('btn-pair').onclick=()=>{

  const m=pairMembers(current), i=m.findIndex(x=>x.id===current.id);
  if(m.length>1) selectSite(m[(i+1)%m.length].id,true);
};

const tourOrder=['grand','valles','mauna','olympus','meteor','tycho','copernicus','haughton','shackleton','atacama','gale','dryvalley','jezero','idaho','tranquillitatis'];
function startTour(){

  else { panel.classList.toggle('side-hidden',!open); panel.classList.remove('collapsed'); $('btn-show-panel').classList.toggle('hidden',open); if(open) panel.removeAttribute('inert'); else panel.setAttribute('inert',''); }
  $('btn-hide-panel').setAttribute('aria-expanded',open?'true':'false');

}
